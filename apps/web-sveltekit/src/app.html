<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link
		href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Google+Sans+Code:wght@400;500;600&display=swap"
		rel="stylesheet"
	/>
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem('theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = storedTheme === 'dark' || (!storedTheme && prefersDark) ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (error) {}
      })();
    </script>
    <script>
      (function () {
        var reloadKey = 'chunk-load-recovery-attempted';
        var reloadWindowMs = 30000;

        function clearRuntimeCaches() {
          var tasks = [];

          if ('caches' in window) {
            tasks.push(
              caches.keys()
                .then(function (keys) {
                  return Promise.all(keys.map(function (key) {
                    return caches.delete(key);
                  }));
                })
                .catch(function () {})
            );
          }

          if ('serviceWorker' in navigator) {
            tasks.push(
              navigator.serviceWorker.getRegistrations()
                .then(function (registrations) {
                  return Promise.all(registrations.map(function (registration) {
                    return registration.unregister();
                  }));
                })
                .catch(function () {})
            );
          }

          return Promise.all(tasks);
        }

        function reloadWithoutCache() {
          var now = Date.now();
          try {
            var url = new URL(window.location.href);
            url.searchParams.set('__chunk_recovery', now.toString());
            window.location.replace(url.toString());
          } catch (error) {
            window.location.reload();
          }
        }

        function triggerReload() {
          var lastReload = sessionStorage.getItem(reloadKey);
          var now = Date.now();
          if (!lastReload || now - parseInt(lastReload, 10) > reloadWindowMs) {
            sessionStorage.setItem(reloadKey, now.toString());
            clearRuntimeCaches().then(reloadWithoutCache, reloadWithoutCache);
          }
        }

        window.addEventListener('error', function (event) {
          var target = event.target;
          var src = target && target.src ? target.src : '';
          var message = event.message || '';
          var stack = event.error && event.error.stack ? event.error.stack : '';

          if (target && target.tagName === 'SCRIPT' && src.indexOf('/_app/immutable/') !== -1) {
            triggerReload();
          }

          if (message.indexOf('ChunkLoadError') !== -1 || /loading chunk/i.test(message) || stack.indexOf('ChunkLoadError') !== -1 || /loading chunk/i.test(stack)) {
            triggerReload();
          }
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          var message = reason && reason.message ? reason.message : '';
          var stack = reason && reason.stack ? reason.stack : '';
          if (message.indexOf('ChunkLoadError') !== -1 || /loading chunk/i.test(message) || stack.indexOf('ChunkLoadError') !== -1 || /loading chunk/i.test(stack)) {
            triggerReload();
          }
        });
      })();
    </script>
%sveltekit.head%
  </head>
  <body class="h-full bg-background antialiased" data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
